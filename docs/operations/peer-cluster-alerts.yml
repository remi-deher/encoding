groups:
  - name: encoding-peer-cluster
    rules:
      - alert: EncodingPeerQuorumLost
        expr: max by (cluster) (encoding_peer_has_quorum) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Aucun pair ne confirme de quorum"
          description: "Rétablir la majorité avec les volumes existants ; ne pas réinitialiser Raft."
      - alert: EncodingPeerProjectionUnavailable
        expr: encoding_peer_projection_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Projection métier indisponible sur un pair"
      - alert: EncodingPeerCommitStalled
        expr: encoding_peer_is_leader == 1 and encoding_peer_uncommitted_entries > 0 and changes(encoding_peer_committed_index[5m]) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Entrées en attente sans progression de l’index engagé"
      - alert: EncodingPeerCatchupStalled
        expr: encoding_peer_remote_revision_lag > 0 and changes(encoding_peer_remote_projection_revision[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Un pair distant ne rattrape plus sa projection"
      - alert: EncodingPeerUnreachable
        expr: encoding_peer_remote_observation_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Plus de statut compatible récent du pair distant"
      - alert: EncodingPeerStorageLow
        expr: encoding_peer_storage_available_bytes < 5368709120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Moins de 5 Gio disponibles sur le volume du pair"
      - alert: EncodingPeerCertificateExpiring
        expr: encoding_peer_certificate_remaining_seconds < 2592000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificat de pair à renouveler sous 30 jours"
