<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
  <title id="title">Maquette d’une barre de sous-navigation compacte</title>
  <desc id="desc">Comparaison desktop et mobile du shell Encoding avec sous-navigation métier et actions de page réunies sur une même barre.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17251f" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 1.4px; fill: #61736b; }
      .label { font-size: 13px; font-weight: 650; fill: #56685f; }
      .body { font-size: 14px; fill: #273932; }
      .small { font-size: 12px; fill: #64766d; }
    </style>
  </defs>
  <rect width="1360" height="820" fill="#eef3f0"/>

  <text x="48" y="48" class="eyebrow">PROPOSITION · PAGE-SUBNAV</text>
  <text x="48" y="82" font-size="27" font-weight="760" fill="#13221b">La navigation de vue et ses actions sur une seule ligne</text>
  <text x="48" y="108" font-size="14" fill="#53665d">Le shell garde les commandes globales ; la barre reste liée au parcours métier affiché.</text>

  <!-- Desktop frame -->
  <g filter="url(#shadow)">
    <rect x="48" y="142" width="890" height="626" rx="18" fill="#ffffff"/>
  </g>
  <path d="M66 142h854a18 18 0 0 1 18 18v38H48v-38a18 18 0 0 1 18-18Z" fill="#fff"/>
  <circle cx="72" cy="169" r="5" fill="#d3ded8"/><circle cx="90" cy="169" r="5" fill="#d3ded8"/><circle cx="108" cy="169" r="5" fill="#d3ded8"/>
  <text x="137" y="174" font-size="12" font-weight="700" fill="#63756c">ENCODING · DESKTOP</text>
  <rect x="48" y="198" width="890" height="1" fill="#e8eeeb"/>

  <!-- Sidebar -->
  <rect x="48" y="199" width="180" height="569" rx="0" fill="#f8faf9"/>
  <rect x="48" y="199" width="1" height="569" fill="#e7eeea"/>
  <rect x="69" y="221" width="30" height="30" rx="9" fill="#145644"/>
  <text x="79" y="242" font-size="17" font-weight="800" fill="#fff">E</text>
  <text x="108" y="241" font-size="15" font-weight="760" fill="#17251f">Encoding</text>
  <g font-size="13" fill="#51645b">
    <rect x="62" y="274" width="151" height="38" rx="10" fill="#e6f1eb"/>
    <rect x="75" y="286" width="14" height="14" rx="3" fill="#145644" opacity=".8"/>
    <text x="99" y="296" font-weight="700" fill="#145644">Piloter</text>
    <rect x="75" y="331" width="14" height="14" rx="4" fill="#b3c1ba"/><text x="99" y="343">Construire</text>
    <rect x="75" y="376" width="14" height="14" rx="4" fill="#b3c1ba"/><text x="99" y="388">Maintenir</text>
    <rect x="75" y="421" width="14" height="14" rx="4" fill="#b3c1ba"/><text x="99" y="433">Administrer</text>
  </g>
  <text x="75" y="735" class="small">Navigation principale</text>

  <!-- App system header -->
  <rect x="228" y="199" width="710" height="54" fill="#fff"/>
  <text x="253" y="232" class="small">Cluster · production</text>
  <circle cx="790" cy="226" r="14" fill="#f0f5f2"/><path d="M790 218v8l5 3" fill="none" stroke="#4e6359" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="832" cy="226" r="14" fill="#f0f5f2"/><path d="M826 226h12m-6-6v12" stroke="#4e6359" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="878" cy="226" r="15" fill="#e5eee9"/><text x="871" y="231" font-size="12" font-weight="750" fill="#315444">RD</text>
  <rect x="228" y="252" width="710" height="1" fill="#edf1ef"/>

  <!-- Main content -->
  <text x="253" y="284" class="eyebrow">VUE MÉTIER · ACTIVITÉ</text>
  <!-- Unified subnav/action row -->
  <rect x="253" y="302" width="660" height="52" rx="14" fill="#f5f8f6"/>
  <rect x="258" y="307" width="100" height="42" rx="11" fill="#dcebe3"/>
  <text x="277" y="333" font-size="14" font-weight="730" fill="#145644">Opérer</text>
  <text x="382" y="333" font-size="14" font-weight="620" fill="#56685f">Diagnostiquer</text>
  <rect x="490" y="318" width="29" height="21" rx="10" fill="#e5ebe8"/>
  <text x="499" y="333" font-size="11" font-weight="700" fill="#52645c">24</text>
  <rect x="621" y="312" width="126" height="32" rx="9" fill="#fff" stroke="#cddbd4"/>
  <path d="M639 328a7 7 0 1 1 2 5m-2-9v4h4" fill="none" stroke="#315b48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="332" font-size="12" font-weight="650" fill="#274438">Actualiser</text>
  <rect x="756" y="312" width="39" height="32" rx="9" fill="#fff" stroke="#cddbd4"/>
  <circle cx="768" cy="328" r="1.5" fill="#496157"/><circle cx="775" cy="328" r="1.5" fill="#496157"/><circle cx="782" cy="328" r="1.5" fill="#496157"/>
  <text x="805" y="332" class="small">Actions secondaires</text>

  <!-- Content placeholder -->
  <rect x="253" y="378" width="660" height="92" rx="14" fill="#f7faf8" stroke="#e4ece7"/>
  <text x="274" y="408" font-size="15" font-weight="730" fill="#1c2d25">Résumé du parcours</text>
  <text x="274" y="432" class="small">Le contenu commence immédiatement sous la barre de navigation.</text>
  <rect x="274" y="447" width="174" height="7" rx="4" fill="#dce6e0"/><rect x="458" y="447" width="112" height="7" rx="4" fill="#e5ece8"/>
  <rect x="253" y="488" width="660" height="245" rx="14" fill="#fff" stroke="#e2eae6"/>
  <rect x="276" y="511" width="614" height="42" rx="9" fill="#f4f7f5"/>
  <text x="293" y="537" class="small" font-weight="700">ÉLÉMENT</text><text x="571" y="537" class="small" font-weight="700">ÉTAT</text><text x="748" y="537" class="small" font-weight="700">MIS À JOUR</text>
  <path d="M276 567h614M276 621h614M276 675h614" stroke="#edf1ef"/>
  <text x="293" y="599" class="body">Traitement de production</text><rect x="560" y="584" width="75" height="24" rx="12" fill="#e3f3e9"/><text x="577" y="600" font-size="11" font-weight="700" fill="#286141">En cours</text><text x="748" y="599" class="small">À l’instant</text>
  <text x="293" y="653" class="body">Export hebdomadaire</text><rect x="560" y="638" width="78" height="24" rx="12" fill="#f8f0df"/><text x="573" y="654" font-size="11" font-weight="700" fill="#795413">En attente</text><text x="748" y="653" class="small">Il y a 4 min</text>
  <text x="293" y="707" class="body">Synchronisation des nœuds</text><rect x="560" y="692" width="75" height="24" rx="12" fill="#e3f3e9"/><text x="577" y="708" font-size="11" font-weight="700" fill="#286141">En cours</text><text x="748" y="707" class="small">Il y a 9 min</text>

  <!-- Mobile frame -->
  <g filter="url(#shadow)">
    <rect x="972" y="142" width="340" height="626" rx="27" fill="#fff"/>
  </g>
  <rect x="988" y="158" width="308" height="594" rx="17" fill="#f8faf9"/>
  <rect x="1090" y="166" width="104" height="7" rx="4" fill="#d8e1dc"/>
  <text x="1008" y="205" class="eyebrow">MOBILE</text>
  <circle cx="1263" cy="199" r="15" fill="#e5eee9"/><text x="1256" y="204" font-size="11" font-weight="750" fill="#315444">RD</text>
  <path d="M1008 220h268" stroke="#e5ece8"/>
  <text x="1008" y="249" font-size="13" font-weight="700" fill="#40564b">Activité</text>
  <!-- compact row with scrollable tabs and overflow action -->
  <rect x="1008" y="265" width="268" height="48" rx="13" fill="#f0f5f2"/>
  <rect x="1012" y="269" width="77" height="40" rx="10" fill="#dcebe3"/>
  <text x="1027" y="294" font-size="12" font-weight="730" fill="#145644">Opérer</text>
  <text x="1101" y="294" font-size="12" font-weight="620" fill="#56685f">Diagnostiquer</text>
  <rect x="1227" y="274" width="40" height="30" rx="9" fill="#fff" stroke="#d2ded8"/>
  <circle cx="1238" cy="289" r="1.4" fill="#496157"/><circle cx="1247" cy="289" r="1.4" fill="#496157"/><circle cx="1256" cy="289" r="1.4" fill="#496157"/>
  <text x="1008" y="337" class="small">Onglets défilants · actions dans le menu ⋯</text>
  <rect x="1008" y="362" width="268" height="89" rx="13" fill="#fff" stroke="#e3ebe7"/>
  <text x="1024" y="390" font-size="13" font-weight="730" fill="#1c2d25">Résumé</text>
  <text x="1024" y="413" class="small">La barre reste sur une ligne.</text>
  <rect x="1024" y="428" width="158" height="6" rx="3" fill="#e0e9e4"/>
  <rect x="1008" y="466" width="268" height="236" rx="13" fill="#fff" stroke="#e3ebe7"/>
  <text x="1024" y="494" font-size="13" font-weight="730" fill="#1c2d25">Activités récentes</text>
  <path d="M1024 514h236M1024 571h236M1024 628h236" stroke="#edf1ef"/>
  <circle cx="1036" cy="544" r="5" fill="#3c8b60"/><text x="1051" y="548" font-size="11" fill="#344a40">Traitement en cours</text>
  <circle cx="1036" cy="601" r="5" fill="#c68a2a"/><text x="1051" y="605" font-size="11" fill="#344a40">Export en attente</text>
  <circle cx="1036" cy="658" r="5" fill="#3c8b60"/><text x="1051" y="662" font-size="11" fill="#344a40">Synchronisation</text>
  <rect x="988" y="715" width="308" height="37" rx="0 0 17 17" fill="#fff"/>
  <rect x="1075" y="728" width="134" height="5" rx="3" fill="#bdc9c3"/>

  <text x="48" y="797" font-size="12" fill="#62746b">Desktop : onglets + actions de page alignés · Mobile : onglets horizontaux + actions secondaires regroupées</text>
</svg>
