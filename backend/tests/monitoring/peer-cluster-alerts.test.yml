rule_files:
  - ../../../docs/operations/peer-cluster-alerts.yml
evaluation_interval: 15s
tests:
  - name: Un leader avec quorum suffit pour le groupe
    interval: 15s
    input_series:
      - series: 'encoding_peer_has_quorum{cluster="a",peer="leader"}'
        values: '1x40'
      - series: 'encoding_peer_has_quorum{cluster="a",peer="follower"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: EncodingPeerQuorumLost
        exp_alerts: []
  - name: Aucun bail majoritaire déclenche une alerte
    interval: 15s
    input_series:
      - series: 'encoding_peer_has_quorum{cluster="a",peer="p1"}'
        values: '0x40'
      - series: 'encoding_peer_has_quorum{cluster="a",peer="p2"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 1m
        alertname: EncodingPeerQuorumLost
        exp_alerts:
          - exp_labels:
              cluster: a
              severity: critical
            exp_annotations:
              summary: Aucun pair ne confirme de quorum
              description: Rétablir la majorité avec les volumes existants ; ne pas réinitialiser Raft.
  - name: Un journal inactif sans attente ne déclenche pas de faux positif
    interval: 15s
    input_series:
      - series: 'encoding_peer_is_leader{cluster="a",peer="p1"}'
        values: '1x40'
      - series: 'encoding_peer_uncommitted_entries{cluster="a",peer="p1"}'
        values: '0x40'
      - series: 'encoding_peer_committed_index{cluster="a",peer="p1"}'
        values: '42x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: EncodingPeerCommitStalled
        exp_alerts: []
  - name: Un journal avec des entrées bloquées alerte
    interval: 15s
    input_series:
      - series: 'encoding_peer_is_leader{cluster="a",peer="p1"}'
        values: '1x40'
      - series: 'encoding_peer_uncommitted_entries{cluster="a",peer="p1"}'
        values: '3x40'
      - series: 'encoding_peer_committed_index{cluster="a",peer="p1"}'
        values: '42x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: EncodingPeerCommitStalled
        exp_alerts:
          - exp_labels:
              cluster: a
              peer: p1
              severity: warning
            exp_annotations:
              summary: Entrées en attente sans progression de l’index engagé
