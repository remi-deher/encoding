services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: encoding
      POSTGRES_USER: encoding
      POSTGRES_PASSWORD: encoding
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - encoding-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encoding -d encoding"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Cluster: Host=postgres;Port=5432;Database=encoding;Username=encoding;Password=encoding
      NodePresence__OfflineAfterSeconds: 30
      FlowBackups__Directory: /var/lib/encoding/flow-backups
      Runtime__ArtifactDirectory: /var/lib/encoding/runtime-artifacts
      PluginSettings__KeyDirectory: /var/lib/encoding/plugin-keys
      Cluster__DiscoveryPort: 8080
      Cluster__AdvertisedApiBaseUrl: ${CLUSTER_ADVERTISED_API_BASE_URL:-http://api:8080/}
    ports:
      - "127.0.0.1:5080:8080"
      - "127.0.0.1:4201:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - encoding-flow-backups:/var/lib/encoding/flow-backups
      - encoding-runtime-artifacts:/var/lib/encoding/runtime-artifacts
      - encoding-plugin-keys:/var/lib/encoding/plugin-keys
    restart: unless-stopped

  node-agent:
    build:
      context: .
      dockerfile: Dockerfile.Agent
    environment:
      Cluster__ApiBaseUrl: http://api:8080
      Node__DataDirectory: /var/lib/encoding-node
      Node__Name: ${NODE_NAME:-encoding-dev-node}
      Node__Roles: ${NODE_ROLES:-worker}
      Node__MaxConcurrentTasks: ${NODE_MAX_CONCURRENT_TASKS:-1}
      Node__HeartbeatIntervalSeconds: 10
      Worker__AutoAcceptEnrollment: ${WORKER_AUTO_ACCEPT_ENROLLMENT:-false}
      WorkerUi__Port: 8081
      # Plugins Sonarr, Radarr, Plex et Jellyfin livrés dans l'image (processus Python isolés par Landlock).
      Runtime__Plugins__0__Id: sonarr
      Runtime__Plugins__0__Version: 1.0.0
      Runtime__Plugins__0__Executable: /usr/bin/python3
      Runtime__Plugins__0__Arguments__0: -B
      Runtime__Plugins__0__Arguments__1: /opt/encoding/plugins/arr/plugin.py
      Runtime__Plugins__0__Arguments__2: sonarr
      Runtime__Plugins__0__ReadOnlyPaths__0: /opt/encoding/plugins/arr
      Runtime__Plugins__1__Id: radarr
      Runtime__Plugins__1__Version: 1.0.0
      Runtime__Plugins__1__Executable: /usr/bin/python3
      Runtime__Plugins__1__Arguments__0: -B
      Runtime__Plugins__1__Arguments__1: /opt/encoding/plugins/arr/plugin.py
      Runtime__Plugins__1__Arguments__2: radarr
      Runtime__Plugins__1__ReadOnlyPaths__0: /opt/encoding/plugins/arr
      Runtime__Plugins__2__Id: plex
      Runtime__Plugins__2__Version: 1.0.0
      Runtime__Plugins__2__Executable: /usr/bin/python3
      Runtime__Plugins__2__Arguments__0: -B
      Runtime__Plugins__2__Arguments__1: /opt/encoding/plugins/plex/plugin.py
      Runtime__Plugins__2__ReadOnlyPaths__0: /opt/encoding/plugins/plex
      Runtime__Plugins__3__Id: jellyfin
      Runtime__Plugins__3__Version: 1.0.0
      Runtime__Plugins__3__Executable: /usr/bin/python3
      Runtime__Plugins__3__Arguments__0: -B
      Runtime__Plugins__3__Arguments__1: /opt/encoding/plugins/jellyfin/plugin.py
      Runtime__Plugins__3__ReadOnlyPaths__0: /opt/encoding/plugins/jellyfin
      WorkerUi__Origins: ${WORKER_UI_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201,http://localhost:5080,http://127.0.0.1:5080}
    ports:
      - "127.0.0.1:5081:8081"
    volumes:
      - encoding-node-data:/var/lib/encoding-node
      - ../media-test:/media/test
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  encoding-flow-backups:
  encoding-runtime-artifacts:
  encoding-plugin-keys:
  encoding-postgres-data:
  encoding-node-data:
