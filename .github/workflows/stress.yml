name: Stress
# Charge lourde de la base SQLite d'un nœud (grosse file, nombreux nœuds). Exclue des PR (Category!=Stress dans backend.yml).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      executions:
        description: Exécutions en file
        default: '20000'
      nodes:
        description: Nœuds simulés
        default: '30'
      seconds:
        description: Durée de la charge (s)
        default: '60'
permissions:
  contents: read
concurrency:
  group: stress
  cancel-in-progress: false
jobs:
  sqlite-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/tests/Encoding.Runtime.Tests --configuration Release --no-restore
      - run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests --configuration Release --no-build
          --filter "Category=Stress"
          --logger "trx;LogFileName=stress.trx" --results-directory test-results
        env:
          ENCODING_STRESS_EXECUTIONS: ${{ inputs.executions || '20000' }}
          ENCODING_STRESS_NODES: ${{ inputs.nodes || '30' }}
          ENCODING_STRESS_SECONDS: ${{ inputs.seconds || '60' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-test-results
          path: test-results
          retention-days: 14
