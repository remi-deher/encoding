name: Image
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/image.yml'
permissions:
  contents: read
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  image:
    # Vérifie que l'image unique se construit avant la fusion ; la publication se fait dans release.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=encoding
          cache-to: type=gha,scope=encoding,mode=max
