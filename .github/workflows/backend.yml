name: Backend
on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "!backend/tests/monitoring/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "!backend/tests/monitoring/**"
      - ".github/workflows/backend.yml"
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror

  backend-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compose files stay valid
        run: |
          docker compose -f backend/docker-compose.yml config -q
          docker compose -f backend/docker-compose.yml -f backend/docker-compose.gpu.yml config -q
      - name: No NuGet package with a known vulnerability
        run: |
          dotnet restore backend/Encoding.sln
          dotnet list backend/Encoding.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  backend-runtime-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mediainfo mkvtoolnix python3
      - run: mkvmerge --version
      - run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage" --results-directory test-results
        env:
          ENCODING_TEST_REQUIRE_MEDIA_TOOLS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-runtime-test-results
          path: test-results
          retention-days: 14
  backend-multiprocess-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Real server and workers, SIGKILL of the encoding worker
        run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests --configuration Release --no-build
          --filter "FullyQualifiedName~WorkerProcessLossTests"
          --logger "trx;LogFileName=multiprocess.trx" --results-directory test-results
        env:
          ENCODING_TEST_MULTIPROCESS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-multiprocess-test-results
          path: test-results
          retention-days: 14
  backend-launcher-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - run: dotnet run --project backend/tests/Encoding.Launcher.Tests --configuration Release
  backend-plugin-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mediainfo python3
      - run: python3 -m unittest discover -s backend/plugins/tests -v
      - run: dotnet run --project backend/tests/Encoding.Plugins.Tests --configuration Release
  backend-prototype-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - run: dotnet run --project backend/tools/ClusterMeshPrototype --configuration Release -- test
      - run: dotnet run --project backend/tools/ClusterConsensusPrototype --configuration Release -- test
  ai-cli-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install the pinned official CLI packages
        run: |
          npm install --prefix "$RUNNER_TEMP/encoding-ai-cli" --no-audit --no-fund \
            @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.302
          echo "$RUNNER_TEMP/encoding-ai-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check official CLI versions, options and Landlock execution
        run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests/Encoding.Runtime.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~AiCliNativeCompatibilityTests|FullyQualifiedName~ProductionRuntimeFailsClosedWithoutLandlockOrDeniesFilesOutsideProfile|FullyQualifiedName~ProductionSandboxAllowsReadingSystemOpenSslConfiguration"
        env:
          ENCODING_TEST_AI_CLI_NATIVE: '1'
          ENCODING_TEST_AI_CLI_RUNTIME: ${{ runner.temp }}/encoding-ai-cli/node_modules
