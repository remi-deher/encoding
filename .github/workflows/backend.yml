name: Backend
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg mediainfo python3
      - run: python3 -m unittest discover -s backend/plugins/tests -v
      - run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage" --results-directory test-results
        env:
          ENCODING_TEST_REQUIRE_MEDIA_TOOLS: '1'
      - run: dotnet run --project backend/tests/Encoding.Launcher.Tests --configuration Release
      - run: dotnet run --project backend/tests/Encoding.Plugins.Tests --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results
          retention-days: 14
  image:
    # Vérifie que l'image unique se construit avant la fusion ; la publication se fait dans release.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=encoding
          cache-to: type=gha,scope=encoding,mode=max
