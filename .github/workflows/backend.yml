name: Backend
on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/actions/apt-install/**"
      - ".github/scripts/apt-install.sh"
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror

  backend-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compose files stay valid
        run: |
          docker compose -f backend/docker-compose.yml config -q
          docker compose -f backend/docker-compose.yml -f backend/docker-compose.gpu.yml config -q
      - name: No NuGet package with a known vulnerability
        run: |
          dotnet restore backend/Encoding.sln
          dotnet list backend/Encoding.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  backend-runtime-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg mediainfo mkvtoolnix python3
      - run: mkvmerge --version
      - run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests --configuration Release --no-build
          --filter "Category!=Stress"
          --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage" --results-directory test-results
        env:
          ENCODING_TEST_REQUIRE_MEDIA_TOOLS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-runtime-test-results
          path: test-results
          retention-days: 14
  backend-multiprocess-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg
      - name: Real server and workers, SIGKILL of the encoding worker
        run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests --configuration Release --no-build
          --filter "FullyQualifiedName~WorkerProcessLossTests"
          --logger "trx;LogFileName=multiprocess.trx" --results-directory test-results
        env:
          ENCODING_TEST_MULTIPROCESS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-multiprocess-test-results
          path: test-results
          retention-days: 14
  backend-docker-cluster-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: docker/setup-buildx-action@v3
      - name: Build the real image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: encoding:ci
          cache-from: type=gha,scope=docker-cluster-tests
          cache-to: type=gha,mode=max,scope=docker-cluster-tests
      - name: Add ffmpeg to the isolated cluster-test image
        run: docker build --file .github/docker/Dockerfile.cluster-test --tag encoding:cluster-test .
      - name: Pull the last published image (compatibility between versions)
        run: docker pull mrcryllix/encoding:latest
      - name: Add test media tools to the previous image
        run: docker build --build-arg BASE_IMAGE=mrcryllix/encoding:latest --file .github/docker/Dockerfile.cluster-test --tag encoding:previous-cluster-test .
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg
      - name: Real containers on a Docker network (docker kill of a worker, mixed versions)
        run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests --configuration Release --no-build
          --filter "FullyQualifiedName~DockerClusterTests"
          --logger "trx;LogFileName=docker-cluster.trx" --results-directory test-results
        env:
          ENCODING_TEST_DOCKER: '1'
          ENCODING_TEST_IMAGE: encoding:cluster-test
          ENCODING_TEST_PREVIOUS_IMAGE: encoding:previous-cluster-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-docker-cluster-test-results
          path: test-results
          retention-days: 14
  backend-launcher-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - run: dotnet run --project backend/tests/Encoding.Launcher.Tests --configuration Release
  backend-plugin-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg mediainfo python3
      - run: dotnet run --project backend/tests/Encoding.Plugins.Tests --configuration Release
  backend-prototype-tests:
    runs-on: ubuntu-latest
    needs: backend-compile
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror
      - run: dotnet run --project backend/tools/ClusterMeshPrototype --configuration Release -- test
  ai-cli-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install the pinned official CLI packages
        run: |
          npm install --prefix "$RUNNER_TEMP/encoding-ai-cli" --no-audit --no-fund \
            @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.302
          echo "$RUNNER_TEMP/encoding-ai-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check official CLI versions, options and Landlock execution
        run: >-
          dotnet test backend/tests/Encoding.Runtime.Tests/Encoding.Runtime.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~AiCliNativeCompatibilityTests|FullyQualifiedName~ProductionRuntimeFailsClosedWithoutLandlockOrDeniesFilesOutsideProfile|FullyQualifiedName~ProductionSandboxAllowsReadingSystemOpenSslConfiguration"
        env:
          ENCODING_TEST_AI_CLI_NATIVE: '1'
          ENCODING_TEST_AI_CLI_RUNTIME: ${{ runner.temp }}/encoding-ai-cli/node_modules

  cluster-two-server-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - run: dotnet build backend/Encoding.sln --configuration Release --no-restore -warnaserror -m:1
      - name: Measure two SQLite owners with 7,000 queued tasks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p cluster-measurements
          dotnet test backend/tests/Encoding.Runtime.Tests --configuration Release --no-build \
            --filter "FullyQualifiedName~MeasuresTwoServerOwnershipLoad" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=two-server.trx" --results-directory cluster-measurements \
            | tee cluster-measurements/two-server.log
        env:
          ENCODING_TEST_LARGE_COORDINATION_MEASUREMENTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-two-server-measurements
          path: cluster-measurements
