name: Release
# Publie l'image Docker unique après un merge validé de dev vers main.
# Secrets requis (Settings > Secrets and variables > Actions) : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  checks: read
  pull-requests: read
jobs:
  wait-ci:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      green: ${{ steps.wait.outputs.green }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "La publication n'est autorisée que depuis main."
            echo green=false >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merged_prs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .head.ref == "dev" and .merged_at != null)]')"
          if [ "$(jq length <<< "$merged_prs")" -eq 0 ]; then
            echo "Aucune PR dev vers main fusionnée associée à ce commit; publication refusée."
            echo green=false >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag --points-at "$SHA" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Ce commit possède déjà un tag de release; publication ignorée."
            echo green=false >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sleep 60 # laisse les workflows Backend et Frontend s'enregistrer
          # La policy est un check de PR, pas un check CI de code. Seuls les jobs
          # peer-alerts, build, image et frontend déterminent si la release peut partir.
          ci_shas="$SHA"
          for _ in $(seq 1 120); do
            runs="$(for s in $ci_shas; do gh api "repos/${GITHUB_REPOSITORY}/commits/${s}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "peer-alerts" or .name == "build" or .name == "image" or .name == "frontend")]'; done | jq -s 'add')"
            if [ "$(jq length <<<"$runs")" -eq 0 ] && [ "$ci_shas" = "$SHA" ]; then
              ci_shas="$(for d in backend frontend; do gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${SHA}&path=${d}&per_page=1" --jq '.[0].sha // empty'; done | sort -u | tr '\n' ' ')"
              [ -n "$ci_shas" ] || ci_shas="$SHA"
              continue
            fi
            total="$(jq length <<<"$runs")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            failed="$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length' <<<"$runs")"
            if [ "$failed" -gt 0 ]; then echo "CI en échec : pas de publication."; echo green=false >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then echo green=true >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 20
          done
          echo "Délai dépassé en attendant la CI."; echo green=false >> "$GITHUB_OUTPUT"
  publish:
    needs: wait-ci
    if: needs.wait-ci.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[].labels[].name] | join(",")' || true)"
          echo "version=$(PR_LABELS="$labels" .github/scripts/next-version.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/encoding:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/encoding:latest
          cache-from: type=gha,scope=encoding
          cache-to: type=gha,scope=encoding,mode=max
      - name: Tag git
        run: |
          git tag "v${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.version }}"
