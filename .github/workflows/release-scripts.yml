name: Release scripts
on:
  pull_request:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/release*.yml', '.github/workflows/promotion.yml', '.github/workflows/pr-policy.yml']
permissions:
  contents: read
jobs:
  release-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check .github/scripts/cleanup-released-branches.mjs
      - run: node --check .github/scripts/ci-scopes.mjs
      - run: node --check .github/scripts/wait-ci.mjs
      - run: node --test .github/scripts/*.test.mjs
