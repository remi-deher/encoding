name: Frontend
on:
  push:
    paths: ['frontend/**', 'backend/src/Encoding.Api/Flows/Catalog/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/src/Encoding.Api/Flows/Catalog/**', '.github/workflows/frontend.yml']
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:flows
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
