<div class="application-shell" [class.workspace-shell]="workspaceMode()">
  <mat-toolbar class="application-header">
    <a
      class="brand"
      [routerLink]="workerMode() ? '/worker' : '/'"
      [attr.aria-label]="workerMode() ? 'Console worker' : 'Accueil'"
    >
      <span class="brand-mark" aria-hidden="true">E</span>
      <span class="brand-name">{{ pageTitle() }}</span>
    </a>

    @if (!workerMode()) {
      <app-primary-navigation />
    }

    @if (!workerMode()) {
      <div class="cluster-indicator" [attr.aria-label]="'Présence des nœuds : ' + clusterLabel()">
        <span class="cluster-label">Nœuds</span>
        <span class="cluster-state">{{ clusterLabel() }}</span>
      </div>
    }
  </mat-toolbar>

  <div class="page-transition-region">
    <main id="main-content" class="main-content">
      <router-outlet />
    </main>

    @if (!workerMode() && !workspaceMode()) {
      <footer class="application-footer">
        <span
          >Encoding <span class="footer-separator">·</span> Centre de traitement multimédia</span
        >
        <span class="footer-version">Interface en préparation</span>
      </footer>
    }
  </div>
</div>
