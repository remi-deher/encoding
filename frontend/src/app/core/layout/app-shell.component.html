<div class="application-shell">
  <mat-toolbar class="application-header">
    <a class="brand" [routerLink]="workerMode() ? '/worker' : '/'" [attr.aria-label]="workerMode() ? 'Console worker' : 'Accueil'">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span class="brand-name">{{ pageTitle() }}</span>
    </a>

    @if (!workerMode()) {
      <app-primary-navigation />
    }

    @if (!workerMode()) {
      <div class="cluster-indicator" aria-label="État du cluster : aperçu">
        <span class="cluster-dot" aria-hidden="true"></span>
        <span class="cluster-label">Cluster</span>
        <span class="cluster-state">Aperçu</span>
      </div>
    }
  </mat-toolbar>

  <div class="page-transition-region">
    <main id="main-content" class="main-content">
      <router-outlet />
    </main>

    @if (!workerMode()) {
      <footer class="application-footer">
        <span>Encoding <span class="footer-separator">·</span> Centre de traitement multimédia</span>
        <span class="footer-version">Interface en préparation</span>
      </footer>
    }
  </div>
</div>
