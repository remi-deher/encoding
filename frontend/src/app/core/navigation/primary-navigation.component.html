<nav class="primary-navigation" aria-label="Navigation principale">
  @for (group of groups(); track group.label) {
    <section class="navigation-group" [attr.aria-label]="group.label">
      <h2 class="navigation-group-label">{{ group.label }}</h2>
      <div class="navigation-group-items">
        @for (item of group.items; track item.path) {
          <a
            class="navigation-link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            ariaCurrentWhenActive="page"
          >
            <span class="navigation-glyph" aria-hidden="true">{{ item.glyph }}</span>
            <span class="navigation-link-label">{{ item.label }}</span>
          </a>
        }
      </div>
    </section>
  }
</nav>
