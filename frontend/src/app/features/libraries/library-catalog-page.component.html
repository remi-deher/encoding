<app-management-catalog-template
  [title]="title()"
  [description]="description()"
  [detailOpen]="selectedLibrary() !== null"
  [detailTitle]="detailTitle()"
  [detailDescription]="detailDescription()"
  (detailClosed)="onDetailClosed()"
  filterLabel="Type de média"
  note="Une définition n’accorde aucun accès aux médias. Configurez ensuite les chemins et modes d’accès pour chaque nœud."
>
  <button page-actions matButton="filled" type="button" (click)="addLibrary()">Ajouter une bibliothèque</button>

  <div catalogue-filters>
    <app-category-tabs
      label="Type de média"
      [options]="categoryOptions()"
      [selected]="selectedCategory()"
      (selectedChange)="onCategoryChange($event)"
    />
  </div>

  <app-data-table
    catalogue-table
    [columns]="columns"
    [rows]="filteredLibraries()"
    [selectable]="true"
    [rowOpenable]="true"
    rowOpenLabel="Consulter"
    (rowOpen)="onLibraryOpen($event)"
    emptyMessage="Aucune bibliothèque ne correspond à ce type de média."
  />

  <ng-template #detailContent catalogue-detail>
    <app-detail-field-list [fields]="detailFields()" [tabbed]="true" tabsLabel="Sections de la bibliothèque" />
  </ng-template>
</app-management-catalog-template>
