<app-management-catalog-template
  [title]="title()"
  [detailOpen]="selectedPlugin() !== null"
  [detailTitle]="detailTitle()"
  [detailDescription]="detailDescription()"
  (detailClosed)="onDetailClosed()"
  filterLabel="Famille de plugin"
  note="Les manifestes Plex, Sonarr, Radarr et Jellyfin sont intégrés au catalogue. Leur exécution nécessite encore un processus plugin configuré sur le worker."
>
  <div catalogue-filters>
    <app-category-tabs
      label="Famille de plugin"
      [options]="familyOptions()"
      [selected]="selectedFamily()"
      (selectedChange)="onFamilyChange($event)"
    />
  </div>

  <app-data-table layout="cards"
    catalogue-table
    [columns]="columns"
    [rows]="filteredPlugins()"
    [selectable]="true"
    [rowOpenable]="true"
    rowOpenLabel="Consulter"
    (rowOpen)="onPluginOpen($event)"
    emptyMessage="Aucun plugin ne correspond à cette famille."
  />

  <ng-template #detailContent catalogue-detail>
    <app-detail-card-grid
      [cards]="pluginCards()"
      ariaLabel="Résumé du plugin"
      emptyMessage="Aucune information disponible pour ce plugin."
    />
    <mat-tab-group class="plugin-detail-tabs" aria-label="Détails du plugin">
      <mat-tab label="Composants">
        <app-flow-component-list [components]="selectedComponents()" />
      </mat-tab>
      @if (configurationSchema(); as schema) {
        <mat-tab label="Configuration">
          <div class="plugin-configuration-section">
            <h3>Configuration globale par défaut</h3>
            <p>
              Ces valeurs sont partagées par le cluster. Un flow peut définir ses propres
              dérogations.
            </p>
          </div>
          <app-component-configuration-form
            [schema]="schema"
            [values]="configurationValues()"
            [configuredSecrets]="configuredSecrets()"
            [showConnectionTest]="selectedPlugin()?.id !== 'nodes'"
            [connectionTestBusy]="connectionTestBusy()"
            [connectionTestMessage]="connectionTestMessage()"
            [connectionTestSuccess]="connectionTestSuccess()"
            [submitLabel]="configurationBusy() ? 'Enregistrement…' : 'Enregistrer'"
            (savedWithSecrets)="saveConfiguration($event.values, $event.clearSecrets)"
            (connectionTestRequested)="testConnection($event)"
            (cancelled)="onConfigurationCancelled()"
          />
        </mat-tab>
      }
    </mat-tab-group>
  </ng-template>
</app-management-catalog-template>
