<app-management-catalog-template
  [title]="title()"
  [description]="description()"
  [detailOpen]="selectedNode() !== null"
  [detailTitle]="detailTitle()"
  [detailDescription]="detailDescription()"
  [catalogState]="loadState()"
  [catalogMessage]="catalogMessage()"
  (detailClosed)="onDetailClosed()"
  filterLabel="Rôle du nœud"
  note="L’état et les capacités proviennent du dernier signal reçu. Le statut en ligne est calculé par le cluster."
>
  <button page-actions matButton="filled" type="button" (click)="addNode()">Ajouter un nœud</button>

  <div catalogue-filters>
    <app-category-tabs
      label="Rôle du nœud"
      [options]="roleOptions()"
      [selected]="selectedRole()"
      (selectedChange)="onRoleChange($event)"
    />
  </div>

  <app-data-table
    catalogue-table
    [columns]="columns"
    [rows]="filteredNodes()"
    [selectable]="true"
    [rowOpenable]="true"
    rowOpenLabel="Configurer"
    (rowOpen)="onNodeOpen($event)"
    emptyMessage="Aucun nœud ne correspond à ce rôle."
  />

  <ng-template #detailContent catalogue-detail>
    <app-detail-field-list [fields]="detailFields()" [tabbed]="true" tabsLabel="Sections du nœud" />
    @if (selectedNode()) {
      <p role="note">Les accès bibliothèque et les tâches seront affichés lorsque ces contrats backend seront disponibles.</p>
    }
  </ng-template>
</app-management-catalog-template>
