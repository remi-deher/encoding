<app-execution-monitor-template
  title="Tâches"
  [countText]="countText()"
  [queueCount]="trackingState().data?.queuedCount ?? 0"
  [activeCount]="trackingState().data?.activeCount ?? 0"
  [errorCount]="trackingState().data?.failedCount ?? 0"
  [cancelledCount]="trackingState().data?.cancelledCount ?? 0"
  [historyCount]="
    (trackingState().data?.succeededCount ?? 0) + (trackingState().data?.deferredCount ?? 0)
  "
  [selectedView]="selectedView()"
  [queueColumns]="queueColumns"
  [queueRows]="queueExecutions()"
  [activeColumns]="activeColumns"
  [activeRows]="activeExecutions()"
  [errorColumns]="errorColumns"
  [errorRows]="errorExecutions()"
  [errorActions]="errorActions"
  [selectionActions]="selectionActions"
  [cancelledColumns]="cancelledColumns"
  [cancelledRows]="cancelledExecutions()"
  [historyColumns]="historyColumns"
  [historyRows]="historyExecutions()"
  [feedback]="feedback()"
  [artifactRows]="artifactsState().rows"
  [artifactFeedback]="artifactsState().message"
  (artifactDownload)="downloadArtifact($event)"
  [eventRows]="eventState().rows"
  [eventFeedback]="eventState().message"
  [pipelineSteps]="pipelineState().steps"
  [pipelineFeedback]="pipelineState().message"
  [pipelineExecutionId]="selectedExecutionId() ?? 'execution'"
  [detailTabIndex]="selectedDetailTab()"
  (detailTabChange)="selectedDetailTab.set($event)"
  (executionOpened)="onExecutionOpened($event)"
  (viewChange)="onViewChange($event)"
  (errorAction)="onErrorAction($event)"
  (selectionAction)="onSelectionAction($event)"
>
</app-execution-monitor-template>
