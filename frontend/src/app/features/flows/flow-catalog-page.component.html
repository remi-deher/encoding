<app-management-catalog-template
  [title]="title()"
  [detailOpen]="selectedFlow() !== null"
  [actionOpen]="actionOpen()"
  [actionTitle]="flowCreationForm.title"
  [actionDescription]="flowCreationForm.description"
  [detailTitle]="detailTitle()"
  [detailDescription]="detailDescription()"
  (detailClosed)="onDetailClosed()"
  (actionClosed)="closeFlowCreation()"
  filterLabel="Type de média"
  [catalogState]="catalogState()"
  [catalogMessage]="
    catalogState() === 'loading' ? 'Chargement des flows…' : 'Impossible de charger les flows.'
  "
>
  <ng-template #pageActions>
    <button matButton="filled" type="button" (click)="openFlowCreation()">Créer un flow</button>
  </ng-template>

  <div catalogue-filters>
    <app-category-tabs
      label="Type de média"
      [options]="categoryOptions()"
      [selected]="selectedCategory()"
      (selectedChange)="onCategoryChange($event)"
    />
  </div>

  <app-data-table
    catalogue-table
    [columns]="columns"
    [rows]="filteredFlows()"
    [selectable]="true"
    [rowOpenable]="true"
    rowOpenLabel="Consulter"
    (rowOpen)="onFlowOpen($event)"
    emptyMessage="Aucun flow ne correspond à ce type de média."
  />

  <ng-template #detailContent catalogue-detail>
    <app-detail-field-list [fields]="detailFields()" [tabbed]="true" tabsLabel="Sections du flow" />
  </ng-template>

  <ng-template #detailHeaderActions>
    @if (selectedFlow(); as flow) {
      <app-drawer-action-button
        label="Ouvrir l’éditeur"
        [routerLink]="['/flows', flow.id, 'edit']"
        [navigationInfo]="{ flowEditorDirection: 'forward' }"
      />
    }
  </ng-template>

  <ng-template #actionContent>
    <app-record-form
      [data]="flowCreationForm"
      (submitted)="startFlow($event)"
      (cancelled)="closeFlowCreation()"
    />
  </ng-template>
</app-management-catalog-template>
