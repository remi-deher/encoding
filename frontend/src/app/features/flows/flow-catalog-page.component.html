<app-management-catalog-template
  [title]="title()"
  [detailOpen]="selectedFlow() !== null"
  [actionOpen]="actionOpen()"
  [actionTitle]="actionForm().title"
  [actionDescription]="actionForm().description"
  [detailTitle]="detailTitle()"
  [detailDescription]="detailDescription()"
  (detailClosed)="onDetailClosed()"
  (actionClosed)="closeFlowCreation()"
  filterLabel="Type de média"
  searchLabel="Rechercher un flow"
  [searchQuery]="searchQuery()"
  (searchQueryChange)="searchQuery.set($event)"
  [catalogState]="catalogState()"
  [catalogMessage]="
    catalogState() === 'loading' ? 'Chargement des flows…' : 'Impossible de charger les flows.'
  "
>
  <ng-template #pageActions>
    <button matButton="filled" type="button" (click)="openFlowCreation()">Créer un flow</button>
  </ng-template>

  <div catalogue-filters>
    <app-category-tabs
      label="Type de média"
      [options]="categoryOptions()"
      [selected]="selectedCategory()"
      (selectedChange)="onCategoryChange($event)"
    />
  </div>

  <app-data-table
    layout="resources"
    catalogue-table
    [columns]="columns"
    [listActions]="listActions"
    [rowActions]="rowActions"
    [selectionActions]="selectionActions"
    (listAction)="onListAction($event)"
    (rowAction)="onRowAction($event)"
    (selectionAction)="onSelectionAction($event)"
    [rows]="filteredFlows()"
    [selectable]="true"
    [rowOpenable]="true"
    rowOpenLabel="Consulter"
    (rowOpen)="onFlowOpen($event)"
    emptyMessage="Aucun flow ne correspond à ce type de média."
  />

  <ng-template #detailContent catalogue-detail>
    @if (flowSheet(); as sheet) {
      <app-resource-sheet
        ariaLabel="Fiche du flow"
        [title]="sheet.title"
        [subtitle]="sheet.subtitle"
        [sections]="sheet.sections"
      />
    }
  </ng-template>

  <ng-template #detailHeaderActions>
    @if (selectedFlow(); as flow) {
      <app-drawer-action-button
        label="Ouvrir l’éditeur"
        [routerLink]="['/flows', flow.id, 'edit']"
        [navigationInfo]="{ flowEditorDirection: 'forward' }"
      />
    }
  </ng-template>

  <ng-template #actionContent>
    <app-record-form
      [data]="actionForm()"
      (submitted)="submitAction($event)"
      (cancelled)="closeFlowCreation()"
    />
    @if (sourcePreviewStatus() === 'loading') {
      <p role="status">Chargement de la version source…</p>
    } @else if (sourcePreviewStatus() === 'error') {
      <p role="alert">Le flow source n’est pas disponible pour l’aperçu.</p>
    } @else if (sourcePreview(); as flow) {
      <app-flow-preview [flow]="flow" [components]="sourcePreviewComponents()" mode="flow" />
    }
  </ng-template>
</app-management-catalog-template>
