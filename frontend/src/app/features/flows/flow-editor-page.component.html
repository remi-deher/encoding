<app-detail-drawer
  [opened]="componentPickerOpen()"
  [title]="'Composants du flow'"
  [description]="'Recherchez et ajoutez des blocs fournis par les plugins.'"
  [content]="componentTemplate()"
  (closed)="componentPickerOpen.set(false)"
>
  <div drawer-main class="flow-editor-page">
    <app-page-header [title]="flowTitle()" />
    <app-flow-graph-editor
      [nodes]="nodes()"
      [connections]="connections()"
      (addComponentRequested)="onAddComponentRequested()"
      (configurationRequested)="onConfigurationRequested($event)"
      (branchComponentRequested)="onBranchComponentRequested($event)"
      (connectionRequested)="onConnectionRequested($event)"
      (nodePositionChanged)="onNodePositionChanged($event)"
      (nodeRemoved)="removeNode($event)"
      (connectionRemoved)="removeConnection($event)"
    />
  </div>

  <ng-template #componentPicker>
    <app-searchable-component-catalog
      [components]="components"
      [typeOptions]="typeOptions"
      [pluginOptions]="pluginOptions"
      (selected)="addComponent($event)"
    />
  </ng-template>
</app-detail-drawer>

<app-detail-drawer
  [opened]="configurationOpen()"
  [title]="configuringNode()?.component?.name ?? 'Configuration du composant'"
  [description]="configuringNode()?.component?.description ?? ''"
  [content]="configurationTemplate()"
  (closed)="configurationOpen.set(false)"
>
  <ng-template #componentConfiguration>
    <app-component-configuration-form
      [schema]="configuringNode()?.component?.configurationSchema"
      [values]="configuringNode()?.configuration ?? {}"
      (saved)="saveNodeConfiguration($event)"
      (cancelled)="configurationOpen.set(false)"
    />
  </ng-template>
</app-detail-drawer>
