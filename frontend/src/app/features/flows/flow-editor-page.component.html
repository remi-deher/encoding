<div class="flow-workbench">
  <!-- Zone 1 : Command Bar -->
  <app-flow-command-bar
    [title]="flowTitle()"
    [mediaType]="flowMediaType()"
    [storedVersion]="storedVersion()"
    [hasDraft]="hasDraft()"
    [hasUnsavedChanges]="hasUnsavedChanges()"
    [backupStatus]="backupStatus()"
    [editorStatus]="editorStatus()"
    [nodeCount]="nodes().length"
    [saving]="saving()"
    [validating]="validating()"
    [canSave]="hasUnsavedChanges() || hasDraft()"
    [disabled]="loadState() !== 'ready'"
    [simulatorBusy]="simulator.busy()"
    [canCreatePack]="storedVersion() >= 1"
    [paletteOpen]="paletteOpen()"
    [inspectorOpen]="inspectorOpen()"
    [trayOpen]="trayOpen()"
    (titleChange)="onTitleChange($event)"
    (saveRequested)="saveFlow()"
    (validateRequested)="validateGraph()"
    (simulateRequested)="openSimulator()"
    (packCreationRequested)="openPackCreation()"
    (aiAssistantRequested)="openAiAssistant()"
    (togglePalette)="paletteOpen.set(!paletteOpen())"
    (toggleInspector)="inspectorOpen.set(!inspectorOpen())"
    (toggleTray)="trayOpen.set(!trayOpen())"
  />

  <!-- Main Split Body (Zone 2, Zone 3, Zone 4) -->
  <div class="workbench-body">
    <!-- Zone 2 : Left Palette Dock -->
    <app-flow-palette-dock
      [opened]="paletteOpen()"
      [components]="components()"
      [packCatalog]="packCatalog()"
      [insertionPending]="componentDestination() !== null"
      [destinationLabel]="destinationDescription()"
      (openedChange)="paletteOpen.set($event)"
      (componentSelected)="onPaletteComponentSelected($event)"
      (packSelected)="onPalettePackSelected($event)"
      (cancelInsertion)="cancelInsertion()"
    />

    <!-- Zone 3 : Center Canvas Workspace -->
    <main class="workbench-canvas" role="main" aria-label="Canevas d'édition du flow">
      @if (loadState() !== 'ready') {
        <div class="canvas-state-message" role="status">
          <p>
            {{
              loadState() === 'loading' ? 'Chargement du flow…' : 'Le flow n’a pas pu être chargé.'
            }}
          </p>
        </div>
      } @else {
        <app-flow-graph-editor
          [nodes]="nodes()"
          [componentPacks]="componentPacks()"
          [mediaType]="flowMediaType()"
          (configurationChanged)="onInlineConfigurationChanged($event)"
          [connections]="connections()"
          (configurationRequested)="onConfigurationRequested($event)"
          (branchComponentRequested)="onBranchComponentRequested($event)"
          (terminationRequested)="onTerminationRequested($event)"
          (connectionRequested)="onConnectionRequested($event)"
          (continuationRequested)="onContinuationRequested($event)"
          (connectionsChanged)="onConnectionsChanged($event)"
          (nodeRemoved)="removeNode($event)"
          (connectionRemoved)="removeConnection($event)"
        />
      }
    </main>

    <!-- Zone 4 : Right Inspector Dock -->
    <app-flow-inspector-dock
      [opened]="inspectorOpen()"
      [node]="configuringNode()"
      [schema]="configuringSchema()"
      [values]="configuringValues()"
      [flowTitle]="flowTitle()"
      [flowMediaType]="flowMediaType()"
      [nodeCount]="nodes().length"
      [connectionCount]="connections().length"
      (openedChange)="inspectorOpen.set($event)"
      (instanceNameChange)="renameNode($event)"
      (configurationSaved)="saveNodeConfiguration($event)"
      (deleteNodeRequested)="onInspectorDeleteNode($event)"
      (closeRequested)="closeInspector()"
    />
  </div>

  <!-- Zone 5 : Bottom Tray (Simulation & Diagnostics) -->
  <app-flow-simulation-tray
    [opened]="trayOpen()"
    [(activeTab)]="trayTab"
    [nodes]="nodes()"
    [profile]="simulator.profile()"
    [result]="simulator.result()"
    [busy]="simulator.busy()"
    [error]="simulator.error()"
    [validationIssues]="validationIssues()"
    [validating]="validating()"
    [isValid]="validationSuccess()"
    (openedChange)="trayOpen.set($event)"
    (runRequested)="simulator.run($event)"
    (continueRequested)="simulator.continue($event)"
    (fileSelected)="simulator.import($event)"
    (revalidateRequested)="validateGraph()"
  />

  <!-- Modal Dialog : Création de Pack -->
  @if (packCreationOpen()) {
    <div
      class="modal-backdrop"
      (click)="packCreationOpen.set(false)"
      role="dialog"
      aria-modal="true"
      aria-label="Créer un pack depuis la version publiée"
    >
      <div class="modal-card" (click)="$event.stopPropagation()">
        <app-record-form
          [data]="packCreationForm()"
          (submitted)="createPackFromPublishedFlow($event)"
          (cancelled)="packCreationOpen.set(false)"
        />
      </div>
    </div>
  }
</div>
