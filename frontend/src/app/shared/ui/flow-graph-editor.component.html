<app-flow-canvas
  (componentDropped)="!readOnly() && componentDropped.emit($event)"
  [readOnly]="readOnly()"
  [nodes]="visualNodes()"
  [mediaType]="mediaType()"
  [simulationResult]="simulationResult()"
  (simulationDetailsRequested)="simulationDetailsRequested.emit()"
  [connections]="visualConnections()"
  [showConnections]="showConnections()"
  [positions]="canvasPositions()"
  [selectedNodeId]="selectedNodeId()"
  [expandedPacks]="expandedPackList()"
  (selectNode)="selectedNodeId.set($event)"
  (configure)="requestConfiguration($event)"
  (connect)="onCanvasConnect($event)"
  (disconnect)="onCanvasDisconnect($event)"
  (remove)="nodeRemoved.emit($event)"
  (duplicate)="duplicateRequested.emit($event)"
  (askAi)="aiRequested.emit($event)"
  (insert)="onCanvasInsert($event)"
  (positionChanged)="setCanvasPosition($event)"
  (positionsChanged)="setCanvasPositions($event)"
  (packToggle)="togglePack($event)"
  (paletteRequested)="paletteRequested.emit()"
/>
