<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Encoding · Centre de traitement multimédia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      try {
        var t = localStorage.getItem('encoding.theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        var p = localStorage.getItem('encoding.palette');
        if (p !== 'forest' && p !== 'ocean' && p !== 'iris' && p !== 'rose') p = 'forest';
        document.documentElement.dataset.palette = p;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
